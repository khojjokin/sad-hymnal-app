name: TestFlight

# Checks the app on Linux, then builds it with Xcode on a GitHub Mac and uploads it to TestFlight.
# Runs on every push to main that changes the app, or by hand: Actions → TestFlight → Run workflow.
# Logs from every run are also saved to the ci-logs branch.
#
# Needs one repository secret (Settings → Secrets and variables → Actions → New repository secret):
#   ASC_KEY_P8_BASE64   the App Store Connect API key's .p8 file, base64-encoded
# The key's id and issuer are below; repository variables of the same names win when set.

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - TESTFLIGHT.md
  workflow_dispatch:
    inputs:
      mac:
        description: "Which GitHub Mac to build on (Intel when the Apple-chip Macs are busy)"
        type: choice
        default: macos-15
        options: [macos-15, macos-26, macos-15-intel]

permissions:
  contents: write

concurrency:
  group: testflight
  cancel-in-progress: true

env:
  ASC_KEY_ID: ${{ vars.ASC_KEY_ID || 'PD6DWK7T4C' }}
  ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID || '232fdb99-c796-444e-8430-34452fd67484' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install, type-check and bundle
        run: bash scripts/ci-check.sh
      - name: Save logs
        if: always()
        run: bash scripts/ci-publish-logs.sh check

  testflight:
    needs: check
    runs-on: ${{ inputs.mac || 'macos-15' }}
    timeout-minutes: 90
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Use the newest Xcode 26
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          ls -ld /Applications/Xcode*.app | tee "$RUNNER_TEMP/logs/xcodes.txt"
          # A beta can hide behind a tidy name, so look at where each one really lives.
          resolve() { for x in "$@"; do if [ -d "$x" ]; then (cd "$x" && pwd -P); fi; done | { grep -viE 'beta|candidate' || true; } | sort -u -V | tail -1; }
          XC=$(resolve /Applications/Xcode_26*.app)
          [ -n "$XC" ] || XC=$(resolve /Applications/Xcode_*.app)
          echo "using $XC" | tee -a "$RUNNER_TEMP/logs/xcodes.txt"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
      - name: Put the App Store Connect key in place
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -z "$ASC_KEY_P8_BASE64" ]; then
            echo "RESULT: STOPPED (the ASC_KEY_P8_BASE64 secret isn't set: see TESTFLIGHT.md)" | tee -a "$RUNNER_TEMP/logs/status.txt"
            exit 1
          fi
          # Accept the file base64-encoded or pasted as it is.
          if printf '%s' "$ASC_KEY_P8_BASE64" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_P8_BASE64" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          else
            printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          fi
          chmod 600 "$RUNNER_TEMP/keys/"*
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" || { echo "RESULT: STOPPED (ASC_KEY_P8_BASE64 isn't a .p8 key)" | tee -a "$RUNNER_TEMP/logs/status.txt"; exit 1; }
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          # Every upload needs a higher build number; a re-run of the same run gets the next one.
          echo "BUILD_NUMBER=$((GITHUB_RUN_NUMBER * 10 + GITHUB_RUN_ATTEMPT))" >> "$GITHUB_ENV"
      - name: Build with Xcode and upload to TestFlight
        timeout-minutes: 80
        run: bash scripts/ci-testflight.sh
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys" "$HOME/.appstoreconnect/private_keys"
      - name: Save logs
        if: always()
        run: bash scripts/ci-publish-logs.sh testflight
